<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NVStreamer Local</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#e8edf3;background:#11161c}*{box-sizing:border-box}body{margin:0;display:flex;min-height:100vh}.side{width:220px;background:#19212b;border-right:1px solid #2d3743;padding:24px 14px}.brand{font-weight:700;font-size:18px;padding:8px 12px 28px}.nav{display:block;width:100%;border:0;background:none;color:#aeb8c4;text-align:left;padding:12px;border-radius:6px;cursor:pointer;font-size:14px}.nav.active,.nav:hover{background:#2b3948;color:#fff}.main{flex:1;padding:28px;max-width:1300px;margin:0 auto;width:100%}h1{font-size:24px;margin:0 0 22px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px}button,.upload{background:#2f81f7;color:#fff;border:0;border-radius:5px;padding:9px 14px;cursor:pointer;font-weight:600}button.secondary{background:#303b48}input[type=file]{display:none}.drop{border:1px dashed #546477;border-radius:7px;padding:34px;text-align:center;color:#aeb8c4;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card{background:#1b2530;border:1px solid #303d4b;border-radius:7px;overflow:hidden}.thumb{height:145px;background:#0d1117;display:flex;align-items:center;justify-content:center;color:#6e7b89;font-size:13px}.thumb video{width:100%;height:100%;object-fit:contain}.body{padding:14px}.name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:#9ba8b6;font-size:12px;margin:8px 0}.badge{display:inline-block;border-radius:4px;padding:3px 7px;background:#254b35;color:#8ee0a8;font-size:11px;margin-bottom:8px}.url{font-size:11px;color:#9ba8b6;word-break:break-all}.actions{display:flex;gap:8px;margin-top:12px}.actions button{padding:6px 9px;font-size:12px}.danger{background:#a33b46!important}.hidden{display:none}.empty{color:#9ba8b6;text-align:center;padding:70px 10px;border:1px dashed #394856;border-radius:7px}.progress{height:4px;background:#2d3743;margin-top:8px}.progress i{display:block;height:100%;background:#2f81f7;width:0}.error{color:#ff8e97;margin:12px 0;font-size:13px}@media(max-width:650px){.side{width:160px}.main{padding:18px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <aside class="side"><div class="brand">NVStreamer</div><button class="nav active" data-view="streams">Streams</button><button class="nav" data-view="upload">Media Upload</button><button class="nav" data-view="management">Management</button></aside>
  <main class="main"><div id="error" class="error"></div><section id="streams"><h1>Streams</h1><div class="toolbar"><button id="refresh">Refresh</button><button class="secondary" id="uploadShortcut">Upload video</button></div><div id="grid" class="grid"></div></section>
    <section id="upload" class="hidden"><h1>Media Upload</h1><label class="drop" for="files">Drag and drop MP4/MKV files here, or click to browse<input id="files" type="file" accept=".mp4,.mkv" multiple></label><div id="queue"></div></section>
    <section id="management" class="hidden"><h1>Management</h1><div class="toolbar"><button class="danger" id="deleteSelected">Delete selected</button></div><div id="managementList"></div></section>
  </main>
  <script>
    const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let streams=[];
    async function api(path,opt){const r=await fetch(path,opt);if(!r.ok)throw Error(await r.text());return r.json()}
    async function load(){try{streams=await api('/api/v1/streams');render()}catch(e){$('#error').textContent='API error: '+e.message}}
    function render(){const grid=$('#grid');if(!streams.length){grid.innerHTML='<div class="empty">No streams. Upload a video to get started.</div>';return}grid.innerHTML=streams.map(s=>`<article class="card"><div class="thumb"><video controls preload="metadata" src="/api/v1/media/${s.media_id}/file"></video></div><div class="body"><div class="name">${esc(s.filename)}</div><div class="badge">${esc((s.filename||'').split('.').pop().toUpperCase())} · ${esc(s.status)}</div><div class="meta">${esc(s.codec||'unknown')} · ${s.fps?Number(s.fps).toFixed(1)+' fps':'fps n/a'} · ${Number(s.duration_sec||0).toFixed(1)} sec</div><div class="url">${esc(s.rtsp_url)}</div><div class="actions"><button data-act="${s.status==='running'?'stop':'start'}" data-id="${s.id}">${s.status==='running'?'Stop':'Start'}</button><button class="secondary" data-copy="${esc(s.rtsp_url)}">Copy URL</button></div></div></article>`).join('');$('#managementList').innerHTML=streams.map(s=>`<label style="display:block;padding:12px;border-bottom:1px solid #2d3743"><input type="checkbox" data-select="${s.media_id}"> ${esc(s.filename)} <span style="color:#9ba8b6">${esc(s.status)}</span></label>`).join('')}
    async function upload(files){for(const file of files){const fd=new FormData();fd.append('file',file);const line=document.createElement('div');line.innerHTML=`${esc(file.name)}<div class="progress"><i></i></div>`;$('#queue').append(line);try{await api('/api/v1/media',{method:'POST',body:fd});line.querySelector('i').style.width='100%'}catch(e){line.classList.add('error');line.append(' '+e.message)}}await load()}
    document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('section').forEach(x=>x.classList.toggle('hidden',x.id!==b.dataset.view));if(b.dataset.view==='streams')load()});$('#files').onchange=e=>upload(e.target.files);$('#uploadShortcut').onclick=()=>document.querySelector('[data-view=upload]').click();$('#refresh').onclick=load;$('#grid').onclick=async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.copy){await navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copied'}else{await api(`/api/v1/streams/${b.dataset.id}/${b.dataset.act}`,{method:'POST'});await load()}}catch(err){$('#error').textContent=err.message}};$('#deleteSelected').onclick=async()=>{for(const c of document.querySelectorAll('[data-select]:checked'))await api('/api/v1/media/'+c.dataset.select,{method:'DELETE'});await load()};load();
  </script>
</body></html>
