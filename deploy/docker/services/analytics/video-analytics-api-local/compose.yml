# License-free replacement for the NVIDIA vss-video-analytics-api image.
services:
  vss-video-analytics-api:
    build:
      context: ../../../../services/analytics/video-analytics-api-local
    image: vss-video-analytics-api-local:dev
    container_name: vss-video-analytics-api
    network_mode: host
    environment:
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://127.0.0.1:9200}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
