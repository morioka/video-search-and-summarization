#
# Optional override for the stored-video VSS path. It replaces the
# NVIDIA-distributed application images with locally built images. Infrastructure
# images (Kafka, Elasticsearch, Redis, PostgreSQL) remain unchanged.

services:
  # Shared CPU-only RT-CV compatibility service for Search/Alerts contract tests.
  rt-cv-local:
    build:
      context: ../../services/analytics/rt-cv-local
    image: ${RTCV_LOCAL_IMAGE:-vss-rt-cv-local:dev}
    container_name: vss-rt-cv-local
    network_mode: host
    environment:
      RTCV_VIDEO_ROOT: /data/videos
      RTCV_KAFKA_BOOTSTRAP_SERVERS: ${RTVI_OPENAI_KAFKA_BOOTSTRAP_SERVERS:-127.0.0.1:9092}
      RTCV_ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://127.0.0.1:9200}
      RTCV_RAW_TOPIC: ${RTCV_RAW_TOPIC:-ds-perception}
      RTCV_ALERT_TOPIC: ${RTCV_ALERT_TOPIC:-mdx-alerts}
      RTCV_INCIDENT_TOPIC: ${RTCV_INCIDENT_TOPIC:-mdx-incidents}
      RTCV_RULES_FILE: /etc/rt-cv-local/rules.json
    volumes:
      - ./data-dir/videos/dev-profile-lvs:/data/videos:ro
      - ./rt-cv-local/rules.json:/etc/rt-cv-local/rules.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # The profile's original `rtvi-vlm` service remains defined in the base
  # compose files. It is intentionally commented out here because it points
  # to the NVIDIA image; start the validated OpenAI-compatible service from
  # `services/rtvi/rt-vlm-openai/docker-compose.cpu.yml` instead.
  # rtvi-vlm:
  #   image: ${RTVI_VLM_IMAGE:-nvcr.io/nvidia/vss-core/vss-rt-vlm:${RTVI_VLM_IMAGE_TAG:-3.2.1}}
  #   runtime: nvidia

  vss-vst-storage-local:
    build:
      context: ../../services/analytics/vst-storage-local
    image: ${VST_STORAGE_LOCAL_IMAGE:-vss-vst-storage-local:dev}
    container_name: vss-vst-storage-local
    network_mode: host
    environment:
      VST_VIDEO_ROOT: /data/videos
      NVSTREAMER_URL: ${LICENSE_FREE_NVSTREAMER_URL:-http://127.0.0.1:31000}
    volumes:
      - ./data-dir/videos/dev-profile-lvs:/data/videos
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:31001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  lvs-server:
    build:
      context: ../..
      dockerfile: services/video-summarization-local/Dockerfile
    image: ${VSS_LVS_IMAGE:-vss-lvs-local:dev}
    container_name: vss-lvs-local
    network_mode: host
    environment:
      VIA_LOCAL_ASSET_DIR: /data/via-assets
      VIA_VLM_ENDPOINT: ${LICENSE_FREE_VLM_ENDPOINT:-http://127.0.0.1:8018/v1}
      VIA_VLM_OPENAI_MODEL_DEPLOYMENT_NAME: ${VLM_NAME:-gpt-4o}
      VIA_VLM_API_KEY: ${OPENAI_API_KEY:-dummy}
      VIA_KAFKA_BOOTSTRAP_SERVERS: ${RTVI_OPENAI_KAFKA_BOOTSTRAP_SERVERS:-127.0.0.1:9092}
      VIA_KAFKA_TOPIC: ${RTVI_OPENAI_KAFKA_TOPIC:-mdx-vlm-captions}
      BACKEND_PORT: ${BACKEND_PORT:-38111}
    volumes:
      - ./data-dir/videos/dev-profile-lvs:/data/via-assets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:38111/v1/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  vss-agent:
    build:
      context: ../../services
      dockerfile: agent/docker/Dockerfile
      args:
        RUNTIME_BASE: ${LICENSE_FREE_AGENT_RUNTIME_BASE:-python:3.13-slim-bookworm}
    image: ${VSS_AGENT_IMAGE:-vss-agent-generic:dev}
    volumes:
      - ./data-dir/videos/dev-profile-lvs:/home/vst/vst_release/streamer_videos:ro
    environment:
      # The local NVStreamer compatibility API listens on 31000. The
      # proprietary VST ingress on 30888 does not expose stream inventory.
      VST_INTERNAL_URL: ${LICENSE_FREE_VST_INTERNAL_URL:-http://127.0.0.1:31001}
      # Port 8000 is occupied by the base profile; the local Agent instance
      # historically runs on 8001.
      VSS_AGENT_PORT: ${LICENSE_FREE_AGENT_PORT:-8001}
    command: ["serve", "--config_file", "/vss-agent/deploy/docker/developer-profiles/dev-profile-lvs/vss-agent/configs/config.yml", "--host", "0.0.0.0", "--port", "${LICENSE_FREE_AGENT_PORT:-8001}"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s
    depends_on:
      vss-vst-storage-local:
        condition: service_healthy

  # Public RTSP/WebRTC server shared by the local NVStreamer publisher.
  mediamtx:
    image: ${MEDIAMTX_IMAGE:-bluenviron/mediamtx:latest}
    container_name: vss-mediamtx
    network_mode: "host"
    restart: unless-stopped

  vss-va-mcp:
    image: ${VSS_AGENT_IMAGE:-vss-agent-generic:dev}
    environment:
      VST_INTERNAL_URL: ${LICENSE_FREE_VST_INTERNAL_URL:-http://127.0.0.1:31001}
      VSS_AGENT_PORT: ${LICENSE_FREE_AGENT_PORT:-8001}

  vss-ui:
    build:
      context: ../..
      dockerfile: services/ui/Dockerfile
      args:
        UI_RUNTIME_BASE: ${LICENSE_FREE_UI_RUNTIME_BASE:-node:22-bookworm-slim}
    image: ${VSS_UI_IMAGE:-vss-ui-generic:dev}

  # License-free replacement for the NVIDIA NVStreamer image.  It exposes the
  # dashboard on 31000 and publishes uploaded files to the shared MediaMTX
  # RTSP server on 8554.
  nvstreamer-lvs:
    build:
      # Compose resolves this path from deploy/docker/.
      context: ../../services/analytics/nvstreamer-local
    image: ${NVSTREAMER_LOCAL_IMAGE:-vss-nvstreamer-local:dev}
    container_name: vss-nvstreamer-local
    entrypoint: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "31000"]
    network_mode: "host"
    environment:
      NVSTREAMER_VIDEO_ROOT: /data/videos
      NVSTREAMER_RTSP_HOST: ${NVSTREAMER_RTSP_HOST:-127.0.0.1}
      NVSTREAMER_RTSP_PORT: ${NVSTREAMER_RTSP_PORT:-8554}
    volumes:
      - ./data-dir/videos/dev-profile-lvs:/data/videos
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:31000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # The NVIDIA service waits for Kafka; this replacement only needs MediaMTX.
    depends_on:
      mediamtx:
        condition: service_started

  # The proprietary Video Analytics API image is unavailable without NGC
  # access. This local read-only replacement serves the Alerts UI on 8081.
  vss-video-analytics-api:
    build:
      # Compose project directory is deploy/docker; implementation lives at repo/services.
      context: ../../services/analytics/video-analytics-api-local
    image: ${VIDEO_ANALYTICS_API_IMAGE:-vss-video-analytics-api-local:dev}
    network_mode: "host"
    environment:
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://127.0.0.1:9200}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
