# Replace the NVIDIA perception workload for the Search profile.
services:
  vss-video-analytics-api-fusion:
    build:
      context: ../../services/analytics/video-analytics-api-local
    image: ${VIDEO_ANALYTICS_API_IMAGE:-vss-video-analytics-api-local:dev}
    container_name: vss-video-analytics-api
    network_mode: host
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8081"]
    environment:
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://127.0.0.1:9200}

  perception-2d-fusion:
    build:
      context: ../../services/analytics/rt-cv-local
    image: ${RTCV_LOCAL_IMAGE:-vss-rt-cv-local:dev}
    container_name: vss-rtvi-cv
    entrypoint: ["uvicorn"]
    command: ["app:app", "--host", "0.0.0.0", "--port", "9000"]
    # Explicitly replace the DeepStream runtime inherited by the profile.
    runtime: runc
    deploy: !reset {}
    volumes:
      - ${VSS_DATA_DIR:-./data-dir}/videos/dev-profile-search:/data/videos:ro
      - ${RTCV_MODEL_DIR:-./models/rt-cv-local}:/models:ro
    environment:
      RTCV_VIDEO_ROOT: /data/videos
      RTCV_DETECTOR: ${RTCV_DETECTOR:-auto}
      RTCV_ONNX_MODEL: ${RTCV_ONNX_MODEL:-/models/model.onnx}
      RTCV_LABELS: ${RTCV_LABELS:-}
      RTCV_KAFKA_BOOTSTRAP_SERVERS: ${RTCV_KAFKA_BOOTSTRAP_SERVERS:-127.0.0.1:9092}
      RTCV_ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://127.0.0.1:9200}
